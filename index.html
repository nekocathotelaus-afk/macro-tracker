<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>Macro Tracker</title>
<link rel="stylesheet" href="style.css" />
</head>
<body class="app-shell">

  <div class="bg-glow" aria-hidden="true"></div>

  <header class="topbar">
    <button id="settingsBtn" class="icon-btn glass" aria-label="Settings">⚙</button>
    <div class="date-nav">
      <button id="prevDay" class="icon-btn glass" aria-label="Previous day">‹</button>
      <span id="dateLabel" class="date-label">Today</span>
      <button id="nextDay" class="icon-btn glass" aria-label="Next day">›</button>
    </div>
    <div class="streak glass" title="Day streak">🔥<span id="streakCount">0</span></div>
  </header>

  <main>
    <section class="hero-card glass">
      <div class="ring-wrap">
        <svg viewBox="0 0 160 160" class="ring-svg" aria-hidden="true">
          <circle class="ring-track" cx="80" cy="80" r="70"></circle>
          <circle class="ring-fill" id="ring-calories" cx="80" cy="80" r="70"></circle>
        </svg>
        <div class="ring-center">
          <div class="ring-value" id="val-calories">0</div>
          <div class="ring-label">of <span id="target-calories">2000</span> kcal</div>
        </div>
      </div>

      <div class="macro-rings">
        <div class="macro-ring" data-macro="carbs">
          <svg viewBox="0 0 60 60" aria-hidden="true">
            <circle class="mring-track" cx="30" cy="30" r="26"></circle>
            <circle class="mring-fill" id="ring-carbs" cx="30" cy="30" r="26"></circle>
          </svg>
          <div class="macro-ring-label">Carbs<br><span id="val-carbs">0</span>/<span id="target-carbs">200</span>g</div>
        </div>
        <div class="macro-ring" data-macro="protein">
          <svg viewBox="0 0 60 60" aria-hidden="true">
            <circle class="mring-track" cx="30" cy="30" r="26"></circle>
            <circle class="mring-fill" id="ring-protein" cx="30" cy="30" r="26"></circle>
          </svg>
          <div class="macro-ring-label">Protein<br><span id="val-protein">0</span>/<span id="target-protein">150</span>g</div>
        </div>
        <div class="macro-ring" data-macro="fat">
          <svg viewBox="0 0 60 60" aria-hidden="true">
            <circle class="mring-track" cx="30" cy="30" r="26"></circle>
            <circle class="mring-fill" id="ring-fat" cx="30" cy="30" r="26"></circle>
          </svg>
          <div class="macro-ring-label">Fat<br><span id="val-fat">0</span>/<span id="target-fat">65</span>g</div>
        </div>
      </div>
    </section>

    <section class="meal-list">
      <h2>Today's meals</h2>
      <ul id="mealList" class="meal-items"></ul>
      <p id="emptyState" class="empty-state">No meals logged yet — tap the camera below to add one.</p>
    </section>
  </main>

  <nav class="bottom-nav glass">
    <span class="nav-hint">Tap to log a meal</span>
    <button id="fabAdd" class="fab" aria-label="Add meal">📷</button>
  </nav>

  <!-- Add meal bottom sheet -->
  <div id="addSheet" class="sheet-backdrop">
    <div class="sheet glass">
      <div class="sheet-handle"></div>
      <h2>Log a meal</h2>
      <form id="mealForm">
        <label class="photo-label" for="photoInput">
          <div id="photoPreview" class="photo-preview">📷 Add photo</div>
          <input type="file" id="photoInput" accept="image/*" capture="environment" hidden />
        </label>

        <input type="text" id="mealName" placeholder="Meal name (e.g. Chicken & rice)" required />

        <div class="macro-inputs">
          <div class="field">
            <label for="mealCalories">Calories</label>
            <input type="number" id="mealCalories" min="0" step="1" required />
          </div>
          <div class="field">
            <label for="mealCarbs">Carbs (g)</label>
            <input type="number" id="mealCarbs" min="0" step="1" required />
          </div>
          <div class="field">
            <label for="mealProtein">Protein (g)</label>
            <input type="number" id="mealProtein" min="0" step="1" required />
          </div>
          <div class="field">
            <label for="mealFat">Fat (g)</label>
            <input type="number" id="mealFat" min="0" step="1" required />
          </div>
        </div>

        <div class="sheet-actions">
          <button type="button" id="sheetCancel" class="ghost-btn">Cancel</button>
          <button type="submit" class="primary-btn">Save meal</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Settings bottom sheet -->
  <div id="settingsSheet" class="sheet-backdrop">
    <div class="sheet glass">
      <div class="sheet-handle"></div>
      <h2>Daily targets</h2>
      <div class="field">
        <label for="targetCaloriesInput">Calories</label>
        <input type="number" id="targetCaloriesInput" min="0" step="1" />
      </div>
      <div class="field">
        <label for="targetCarbsInput">Carbs (g)</label>
        <input type="number" id="targetCarbsInput" min="0" step="1" />
      </div>
      <div class="field">
        <label for="targetProteinInput">Protein (g)</label>
        <input type="number" id="targetProteinInput" min="0" step="1" />
      </div>
      <div class="field">
        <label for="targetFatInput">Fat (g)</label>
        <input type="number" id="targetFatInput" min="0" step="1" />
      </div>
      <div class="sheet-actions">
        <button id="settingsCancel" type="button" class="ghost-btn">Cancel</button>
        <button id="settingsSave" type="button" class="primary-btn">Save</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
